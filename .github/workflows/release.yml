name: Build and release the AKA Toolkit

# Rassemble en UNE seule Release ce qu'un utilisateur doit copier pour développer sur l'AKA :
#   - AKA-IDE, l'exécutable pour sa machine (Windows et Linux)
#   - SD_files/ : tout ce qu'il faut copier sur la carte SD (chaque firmware dans son propre dossier,
#     plus AKA/ partagé) — prêt à l'emploi, chemins corrects.
#
# CE DÉPÔT NE CONTIENT PAS DE CODE : il télécharge la dernière Release de chacun des trois dépôts
# ci-dessous (déjà buildés par LEUR PROPRE workflow) et les assemble. Si l'un des trois dépôts n'a
# encore aucune Release, ce workflow échoue clairement sur cette étape plutôt que de publier un
# paquet incomplet.
#
# Les trois dépôts sources sont confirmés (23 septembre) :
env:
  AKA_IDE_REPO: Jicehel-Aka/AKA-IDE-Linux-new         # confirmé (log de build du 23/09)
  AKA_LOVE_REPO: Jicehel-Aka/akalove                  # confirmé
  MICROPYTHON_REPO: Jicehel-Aka/MycroPython           # confirmé (orthographe du dépôt, pas une coquille de ma part)

on:
  workflow_dispatch:        # bouton "Run workflow" -- toujours disponible, quel que soit ce qui suit
  schedule:
    - cron: '0 6 * * 1'      # tous les lundis à 6h UTC : rattrape les releases publiées entre-temps
  repository_dispatch:       # déclenchement automatique dès qu'un des 3 dépôts publie -- voir la note
    types: [aka-source-released]   # "Automatiser le déclenchement" plus bas pour l'activer

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # pour AKA/languages.csv de référence, voir plus bas

      # GH_TOKEN : le jeton par défaut suffit pour des dépôts PUBLICS. Pour des dépôts PRIVÉS, remplacez
      # par un secret contenant un Personal Access Token ayant accès aux 3 dépôts (Settings -> Secrets
      # and variables -> Actions -> New repository secret, par ex. TOOLKIT_PAT), et utilisez
      # `${{ secrets.TOOLKIT_PAT }}` ci-dessous à la place de `${{ github.token }}`.
      # secrets.TOOLKIT_PAT || github.token : utilise le PAT s'il est configuré (dépôts privés), sinon
      # le jeton par défaut (suffisant pour des dépôts publics) -- voir la note plus haut.
      - name: Download latest releases
        env:
          GH_TOKEN: ${{ secrets.TOOLKIT_PAT || github.token }}
        run: |
          set -Eeuo pipefail

          # Un seul type de motif (glob, PAS une regex) du début à la fin : gh release download
          # --pattern attend un glob ("aka-ide-*.zip"), pas une expression régulière -- lui passer une
          # regex comme '^aka-ide-.*\.zip$' ne matcherait jamais rien (le ^, le $ et le \. n'ont aucun
          # sens en glob), l'échec passerait alors inaperçu et redeviendrait un "release not found"
          # aussi peu clair qu'avant.
          download_asset() {
            local repo="$1" glob="$2" out_dir="$3"
            echo "Vérification de la dernière release de ${repo}..."
            if ! gh release view --repo "$repo" >/dev/null 2>&1; then
              echo "::error::Aucune release publiée (ou accessible avec ce jeton) dans ${repo}"
              exit 1
            fi

            local matched=0 name
            while IFS= read -r name; do
              # shellcheck disable=SC2053 -- comparaison glob voulue, $glob volontairement sans guillemets
              if [[ "$name" == $glob ]]; then matched=1; fi
            done < <(gh release view --repo "$repo" --json assets --jq '.assets[].name')

            if [ "$matched" -eq 0 ]; then
              echo "::error::Aucun fichier correspondant à '${glob}' dans la dernière release de ${repo}"
              echo "Fichiers présents dans cette release :"
              gh release view --repo "$repo" --json assets --jq '.assets[].name'
              exit 1
            fi

            mkdir -p "$out_dir"
            gh release download --repo "$repo" --pattern "$glob" --dir "$out_dir" --clobber
          }

          download_asset "$AKA_IDE_REPO"     'aka-ide-*.zip'                 dl/ide
          download_asset "$AKA_LOVE_REPO"    'aka-love-sdcard-*.zip'         dl/love
          download_asset "$MICROPYTHON_REPO" 'micropython-aka-sdcard-*.zip' dl/mpy

      - name: Assemble SD_files
        run: |
          mkdir -p SD_files
          # -o : écrase sans demander -- indispensable, les deux zips contiennent tous les deux AKA/
          # languages.csv (identique des deux côtés) ; sans -o, unzip pose une question interactive et
          # BLOQUE le job indéfiniment (trouvé en testant l'assemblage en local avant d'écrire ce fichier).
          unzip -qo "dl/love/$(ls dl/love)" -d SD_files          # dépose AKA_Love/ et AKA/ à la racine
          unzip -qo "dl/mpy/$(ls dl/mpy)" -d SD_files            # dépose micropython/, py/ et AKA/
          (cd SD_files && zip -r ../SD_files.zip .)

      # Copie APRÈS l'assemblage ci-dessus, en écrasant : si ce dépôt garde une copie de référence de
      # AKA/languages.csv (utile pour ajouter un futur langage AVANT que son firmware existe), elle
      # prime sur celles embarquées dans les zips AKA-Love / MicroPython.
      - name: Apply reference AKA/languages.csv (if present in this repo)
        run: |
          if [ -f AKA/languages.csv ]; then
            mkdir -p SD_files/AKA
            cp AKA/languages.csv SD_files/AKA/languages.csv
            cd SD_files && zip -r ../SD_files.zip AKA
          fi

      - name: Rename AKA-IDE executables
        run: |
          mkdir -p ide_out
          cp dl/ide/*win-x64*.zip  ide_out/aka-ide-windows.zip  2>/dev/null || true
          cp dl/ide/*linux-x64*.zip ide_out/aka-ide-linux.zip   2>/dev/null || true

      - name: Next minor version
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor _ <<< "${last#v}"
          echo "tag=v${major}.$((minor + 1)).0" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" SD_files.zip ide_out/*.zip \
            --target "$GITHUB_SHA" --title "AKA Toolkit $TAG" --generate-notes
